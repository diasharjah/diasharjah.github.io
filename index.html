<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دائرة الشؤون الإسلامية | DIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
 <style>
       .tajawal-regular {
  font-family: "Tajawal", serif;
  font-weight: 400;
  font-style: normal;
}

.tajawal-bold {
  font-family: "Tajawal", serif;
  font-weight: 700;
  font-style: normal;
}

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .maintenance-container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 1200px;
            width: 90%;
        }

        .columns {
            display: flex;
            flex-direction: row-reverse; /* This ensures Arabic is on the right */
            gap: 2rem;
        }

        .column {
            flex: 1;
            padding: 1rem;
        }

        .column.arabic {
            text-align: right;
            direction: rtl;
            border-left: 1px solid #eee;
        }

        .column.english {
            text-align: left;
            direction: ltr;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            color: #666;
            font-size: 1.5rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: #3498db;
            text-align: center;
        }

        .estimated-time {
            background-color: #f8f9fa;
            padding: 1rem;
            border-radius: 5px;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .columns {
                flex-direction: column;
            }
            
            .column.arabic {
                border-left: none;
                border-bottom: 1px solid #eee;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="icon">
            <img src="logo.jpg" width="15%"/>
        </div>
        <div class="columns">
            <div class="column arabic">
                <h1 class="tajawal-bold">الموقع قيد الصيانة</h1>
                <p class="tajawal-regular">
                    <span>نعتذر عن الإزعاج.</span>
                     <br/>نحن نقوم حالياً بإجراء بعض التحسينات على موقعنا لنقدم لكم تجربة أفضل.</p>
            </div>
            <div class="column english">
                <h1>WEBSITE UNDER MAINTENANCE</h1>
                <p>
                    <span>We apologize for the inconvenience.</span>
                    <br/> We are currently making some improvements to our website to provide you with a better experience.</p>
            </div>
        </div>
    </div>
</body>
</html>
